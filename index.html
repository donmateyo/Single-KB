<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Kettlebell Pro — Single-Bell Training</title>

<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-2: #1c1c1c;
    --surface-3: #242424;
    --border: #2a2a2a;
    --text: #f5f5f5;
    --text-dim: #8a8a8a;
    --text-faint: #555;
    --accent: #f59e0b;
    --accent-dim: #b87908;
    --accent-glow: rgba(245, 158, 11, 0.15);
    --success: #22c55e;
    --danger: #ef4444;
    --radius: 14px;
    --radius-sm: 8px;
    --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { font-size: 16px; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(90px + var(--safe-bottom));
  }

  /* ===== HEADER ===== */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10, 10, 10, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding-top: var(--safe-top);
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    gap: 12px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 1.05rem;
    letter-spacing: -0.02em;
  }

  .logo-icon {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
  }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  .icon-btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--transition);
    font-size: 1.1rem;
  }

  .icon-btn:hover, .icon-btn:active {
    background: var(--surface-3);
    color: var(--text);
    border-color: var(--accent-dim);
  }

  /* ===== ROUTINE TABS ===== */
  .routine-nav {
    display: flex;
    gap: 8px;
    padding: 0 16px 12px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }

  .routine-nav::-webkit-scrollbar { display: none; }

  .routine-tab {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .routine-tab:hover { color: var(--text); border-color: var(--surface-3); }

  .routine-tab.active {
    background: var(--accent);
    color: #0a0a0a;
    border-color: var(--accent);
  }

  .routine-tab .tab-num {
    font-size: 0.7rem;
    opacity: 0.6;
    font-weight: 800;
  }

  .routine-tab.active .tab-num { opacity: 0.5; }

  /* ===== MAIN ===== */
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }

  .routine-view { display: none; animation: fadeIn 0.3s ease; }
  .routine-view.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== ROUTINE HEADER ===== */
  .routine-header {
    margin-bottom: 20px;
  }

  .routine-badge {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .routine-title {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.15;
    margin-bottom: 6px;
  }

  .routine-subtitle {
    color: var(--text-dim);
    font-size: 0.9rem;
    line-height: 1.5;
    margin-bottom: 16px;
  }

  .routine-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .meta-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    font-size: 0.78rem;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .meta-chip svg { width: 14px; height: 14px; opacity: 0.7; }

  /* ===== CONTROLS BAR ===== */
  .controls-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    align-items: stretch;
  }

  .workout-timer-display {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .workout-timer-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    font-weight: 700;
  }

  .workout-timer-value {
    font-size: 1.5rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .workout-timer-value.running { color: var(--accent); }

  .start-stop-btn {
    background: var(--accent);
    color: #0a0a0a;
    border: none;
    border-radius: var(--radius);
    padding: 0 24px;
    font-size: 0.9rem;
    font-weight: 800;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 110px;
    justify-content: center;
  }

  .start-stop-btn:hover { background: #fbbf24; transform: translateY(-1px); }
  .start-stop-btn:active { transform: translateY(0); }

  .start-stop-btn.running {
    background: var(--danger);
    color: #fff;
  }

  .start-stop-btn.running:hover { background: #dc2626; }

  .start-stop-btn svg { width: 16px; height: 16px; }

  /* ===== EXERCISE LIST ===== */
  .exercise-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .exercise-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: var(--transition);
  }

  .exercise-card.completed {
    border-color: var(--success);
    opacity: 0.6;
  }

  .exercise-card-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    cursor: pointer;
  }

  .exercise-num {
    background: var(--surface-3);
    color: var(--accent);
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 800;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .exercise-card.completed .exercise-num {
    background: var(--success);
    color: #0a0a0a;
  }

  .exercise-info {
    flex: 1;
    min-width: 0;
  }

  .exercise-name {
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 2px;
  }

  .exercise-notes {
    font-size: 0.78rem;
    color: var(--text-dim);
    line-height: 1.4;
  }

  .exercise-toggle {
    background: none;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    padding: 4px;
    transition: var(--transition);
    flex-shrink: 0;
  }

  .exercise-toggle:hover { color: var(--text); }
  .exercise-toggle svg { transition: transform 0.2s; }
  .exercise-card.expanded .exercise-toggle svg { transform: rotate(180deg); }

  .exercise-body {
    display: none;
    padding: 0 16px 16px;
    border-top: 1px solid var(--border);
    margin-top: 0;
  }

  .exercise-card.expanded .exercise-body { display: block; }

  .exercise-detail {
    font-size: 0.82rem;
    color: var(--text-dim);
    line-height: 1.5;
    padding-top: 12px;
  }

  /* ===== SET TRACKING ===== */
  .set-tracker {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .set-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
  }

  .set-label {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-faint);
    width: 36px;
    flex-shrink: 0;
  }

  .set-input-group {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1;
  }

  .set-input-group label {
    font-size: 0.7rem;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .set-input {
    background: var(--surface-3);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 0.82rem;
    width: 52px;
    text-align: center;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .set-input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .set-check {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: var(--surface-3);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    flex-shrink: 0;
  }

  .set-check:hover { border-color: var(--accent); }

  .set-check.done {
    background: var(--success);
    border-color: var(--success);
  }

  .set-check.done svg { opacity: 1; }
  .set-check svg { width: 16px; height: 16px; opacity: 0; transition: var(--transition); }

  .rest-trigger {
    background: var(--accent-glow);
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 0.72rem;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .rest-trigger:hover { background: var(--accent); color: #0a0a0a; }
  .rest-trigger svg { width: 12px; height: 12px; }

  /* ===== CIRCUIT / SPECIAL FORMATS ===== */
  .circuit-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 10px;
  }

  .circuit-round-display {
    text-align: center;
    margin-bottom: 14px;
  }

  .circuit-round-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    font-weight: 700;
  }

  .circuit-round-value {
    font-size: 2rem;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.03em;
  }

  .circuit-round-value span { color: var(--text-faint); font-size: 1.2rem; }

  .circuit-exercises {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .circuit-exercise {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
  }

  .circuit-check {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    border: 2px solid var(--border);
    background: var(--surface-3);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    flex-shrink: 0;
  }

  .circuit-check.done { background: var(--success); border-color: var(--success); }
  .circuit-check svg { width: 14px; height: 14px; opacity: 0; }
  .circuit-check.done svg { opacity: 1; }

  .circuit-exercise-info { flex: 1; }
  .circuit-exercise-name { font-size: 0.85rem; font-weight: 600; }
  .circuit-exercise-reps { font-size: 0.75rem; color: var(--text-dim); }

  .circuit-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }

  .circuit-btn {
    flex: 1;
    padding: 10px;
    border-radius: var(--radius-sm);
    border: none;
    font-weight: 700;
    font-size: 0.82rem;
    cursor: pointer;
    transition: var(--transition);
  }

  .circuit-btn.primary { background: var(--accent); color: #0a0a0a; }
  .circuit-btn.primary:hover { background: #fbbf24; }
  .circuit-btn.secondary { background: var(--surface-3); color: var(--text-dim); border: 1px solid var(--border); }
  .circuit-btn.secondary:hover { color: var(--text); }

  /* ===== LADDER DISPLAY ===== */
  .ladder-progress {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }

  .ladder-rung {
    flex: 1;
    min-width: 60px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 4px;
    text-align: center;
    cursor: pointer;
    transition: var(--transition);
  }

  .ladder-rung:hover { border-color: var(--accent-dim); }
  .ladder-rung.done { background: var(--success); border-color: var(--success); opacity: 0.7; }
  .ladder-rung.current { border-color: var(--accent); background: var(--accent-glow); }

  .ladder-rung-num { font-size: 0.7rem; color: var(--text-faint); font-weight: 700; }
  .ladder-rung.done .ladder-rung-num { color: #0a0a0a; opacity: 0.7; }
  .ladder-rung-reps { font-size: 1rem; font-weight: 800; }
  .ladder-rung.done .ladder-rung-reps { color: #0a0a0a; }

  /* ===== BOTTOM TIMER BAR ===== */
  .timer-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(20, 20, 20, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    padding: 12px 16px calc(12px + var(--safe-bottom));
    z-index: 200;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .timer-bar.visible { transform: translateY(0); }

  .timer-bar-inner {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .rest-timer-display {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .rest-timer-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    font-weight: 700;
  }

  .rest-timer-value {
    font-size: 2rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    letter-spacing: -0.03em;
    line-height: 1;
  }

  .rest-timer-value.done { color: var(--success); }

  .rest-progress-bar {
    height: 4px;
    background: var(--surface-3);
    border-radius: 2px;
    margin-top: 6px;
    overflow: hidden;
  }

  .rest-progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s linear;
    width: 100%;
  }

  .rest-progress-fill.done { background: var(--success); }

  .timer-controls {
    display: flex;
    gap: 8px;
  }

  .timer-btn {
    background: var(--surface-3);
    border: 1px solid var(--border);
    color: var(--text);
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--transition);
  }

  .timer-btn:hover { border-color: var(--accent); }
  .timer-btn svg { width: 18px; height: 18px; }

  .timer-btn.danger { color: var(--danger); }

  .timer-adjust {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }

  .timer-adjust-btn {
    background: var(--surface-3);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
  }

  .timer-adjust-btn:hover { color: var(--accent); border-color: var(--accent-dim); }

  /* ===== PROGRESS SECTION ===== */
  .progress-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 20px;
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .progress-title {
    font-size: 0.82rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
  }

  .progress-percent {
    font-size: 0.82rem;
    font-weight: 800;
    color: var(--accent);
  }

  .progress-bar {
    height: 6px;
    background: var(--surface-3);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* ===== INFO SECTION ===== */
  .info-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-top: 20px;
  }

  .info-section h3 {
    font-size: 0.82rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .info-section p {
    font-size: 0.85rem;
    color: var(--text-dim);
    line-height: 1.6;
    margin-bottom: 10px;
  }

  .info-section p:last-child { margin-bottom: 0; }

  .info-section ul {
    list-style: none;
    padding: 0;
  }

  .info-section li {
    font-size: 0.82rem;
    color: var(--text-dim);
    line-height: 1.6;
    padding-left: 16px;
    position: relative;
    margin-bottom: 4px;
  }

  .info-section li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 9px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 300;
    display: none;
    align-items: flex-end;
    justify-content: center;
    animation: fadeIn 0.2s;
  }

  .modal-overlay.visible { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 720px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 20px 20px calc(20px + var(--safe-bottom));
    animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-handle {
    width: 40px;
    height: 4px;
    background: var(--surface-3);
    border-radius: 2px;
    margin: 0 auto 16px;
  }

  .modal-title {
    font-size: 1.1rem;
    font-weight: 800;
    margin-bottom: 16px;
    letter-spacing: -0.02em;
  }

  .settings-group {
    margin-bottom: 20px;
  }

  .settings-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-faint);
    font-weight: 700;
    margin-bottom: 8px;
  }

  .weight-selector {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .weight-option {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
  }

  .weight-option:hover { color: var(--text); }
  .weight-option.active { background: var(--accent); color: #0a0a0a; border-color: var(--accent); }

  .rest-presets {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .rest-preset {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
  }

  .rest-preset:hover { color: var(--text); }
  .rest-preset.active { background: var(--accent); color: #0a0a0a; border-color: var(--accent); }

  .modal-close {
    width: 100%;
    background: var(--accent);
    color: #0a0a0a;
    border: none;
    border-radius: var(--radius);
    padding: 14px;
    font-size: 0.95rem;
    font-weight: 800;
    cursor: pointer;
    margin-top: 8px;
  }

  .modal-close:hover { background: #fbbf24; }

  .danger-btn {
    width: 100%;
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
    border-radius: var(--radius);
    padding: 12px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: var(--transition);
  }

  .danger-btn:hover { background: var(--danger); color: #fff; }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: calc(100px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface-3);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 0.85rem;
    font-weight: 600;
    z-index: 400;
    opacity: 0;
    pointer-events: none;
    transition: var(--transition);
    white-space: nowrap;
  }

  .toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .toast.success { border-color: var(--success); }
  .toast.error { border-color: var(--danger); }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 480px) {
    .routine-title { font-size: 1.35rem; }
    .workout-timer-value { font-size: 1.25rem; }
    .start-stop-btn { padding: 0 16px; min-width: 90px; font-size: 0.82rem; }
    .set-input { width: 44px; }
  }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border); }
</style>
</head>

// ===== STATE =====
let state = {
  currentRoutine: 0,
  defaultRest: 60,
  kettlebellWeight: 16,
  soundOn: true,
  workoutTimers: {}, // routineId -> seconds elapsed
  workoutRunning: {}, // routineId -> bool
  setProgress: {}, // routineId -> { exerciseIndex -> { setIndex -> done } }
  customReps: {}, // routineId -> { exerciseIndex -> { setIndex -> reps } }
  circuitProgress: {}, // routineId -> { round -> { exerciseIndex -> done } }
  circuitRound: {}, // routineId -> current round
  ladderProgress: {}, // routineId -> { rungIndex -> done }
  eagleProgress: {}, // routineId -> { round -> { exerciseIndex -> done } }
  eagleRound: {}, // routineId -> current round per hand
  flowProgress: {}, // routineId -> { round -> { exerciseIndex -> done } }
  flowRound: {} // routineId -> current round
};

// ===== LOAD/SAVE STATE =====
function loadState() {
  try {
    const saved = localStorage.getItem('kbpro_state');
    if (saved) {
      const parsed = JSON.parse(saved);
      state = { ...state, ...parsed };
    }
  } catch (e) { console.warn('Could not load state', e); }
}

function saveState() {
  try {
    localStorage.setItem('kbpro_state', JSON.stringify(state));
  } catch (e) { console.warn('Could not save state', e); }
}

// ===== TIMER ENGINE =====
let workoutInterval = null;
let restInterval = null;
let restRemaining = 0;
let restTotal = 0;
let restPaused = false;

function startWorkoutTimer(routineId) {
  state.workoutRunning[routineId] = true;
  saveState();
  if (workoutInterval) clearInterval(workoutInterval);
  workoutInterval = setInterval(() => {
    if (state.workoutRunning[routineId]) {
      state.workoutTimers[routineId] = (state.workoutTimers[routineId] || 0) + 1;
      updateWorkoutTimerDisplay();
      saveState();
    }
  }, 1000);
  updateStartStopButton();
}

function stopWorkoutTimer(routineId) {
  state.workoutRunning[routineId] = false;
  saveState();
  if (workoutInterval) { clearInterval(workoutInterval); workoutInterval = null; }
  updateStartStopButton();
}

function toggleWorkout() {
  const r = ROUTINES[state.currentRoutine];
  if (state.workoutRunning[r.id]) {
    stopWorkoutTimer(r.id);
    showToast('Workout paused', 'success');
  } else {
    startWorkoutTimer(r.id);
    showToast('Workout started', 'success');
  }
}

function updateWorkoutTimerDisplay() {
  const r = ROUTINES[state.currentRoutine];
  const seconds = state.workoutTimers[r.id] || 0;
  const display = document.getElementById('workoutTimerValue');
  if (display) {
    display.textContent = formatTime(seconds);
    display.classList.toggle('running', state.workoutRunning[r.id] || false);
  }
}

function updateStartStopButton() {
  const r = ROUTINES[state.currentRoutine];
  const btn = document.getElementById('startStopBtn');
  if (!btn) return;
  const running = state.workoutRunning[r.id] || false;
  btn.classList.toggle('running', running);
  btn.innerHTML = running
    ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg> Pause'
    : '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg> Start';
}

// ===== REST TIMER =====
function startRestTimer(seconds) {
  restRemaining = seconds;
  restTotal = seconds;
  restPaused = false;
  if (restInterval) clearInterval(restInterval);
  document.getElementById('timerBar').classList.add('visible');
  updateRestDisplay();
  restInterval = setInterval(() => {
    if (!restPaused) {
      restRemaining--;
      updateRestDisplay();
      if (restRemaining <= 0) {
        clearInterval(restInterval);
        restInterval = null;
        if (state.soundOn) playBeep();
        document.getElementById('restTimerValue').classList.add('done');
        document.getElementById('restProgressFill').classList.add('done');
        showToast('Rest complete — go!', 'success');
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      }
    }
  }, 1000);
}

function updateRestDisplay() {
  const valEl = document.getElementById('restTimerValue');
  const fillEl = document.getElementById('restProgressFill');
  valEl.textContent = formatTime(restRemaining);
  valEl.classList.remove('done');
  fillEl.classList.remove('done');
  const pct = restTotal > 0 ? (restRemaining / restTotal) * 100 : 0;
  fillEl.style.width = pct + '%';
  // Update pause button icon
  const pauseBtn = document.getElementById('restPauseBtn');
  if (restPaused) {
    pauseBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>';
  } else {
    pauseBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
  }
}

function toggleRestPause() {
  restPaused = !restPaused;
  updateRestDisplay();
}

function adjustRest(delta) {
  if (restRemaining > 0 || restPaused) {
    restRemaining = Math.max(0, restRemaining + delta);
    restTotal = Math.max(restRemaining, restTotal);
    updateRestDisplay();
  }
}

function closeRestTimer() {
  if (restInterval) { clearInterval(restInterval); restInterval = null; }
  restRemaining = 0;
  restPaused = false;
  document.getElementById('timerBar').classList.remove('visible');
}

// ===== SOUND =====
let audioCtx = null;
function playBeep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = 880;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.5);
    // Second beep
    setTimeout(() => {
      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.frequency.value = 1100;
      osc2.type = 'sine';
      gain2.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      osc2.start(audioCtx.currentTime);
      osc2.stop(audioCtx.currentTime + 0.5);
    }, 300);
  } catch (e) { console.warn('Audio error', e); }
}

  const m = Math.floor(seconds / 60);

  const toast = document.getElementById('toast');
  toast.textContent = msg;

}

// ===== INTERACTION HANDLERS =====
function toggleCard(index) {
  const card = document.getElementById(`card-${index}`);
  if (card) card.classList.toggle('expanded');
}

function toggleSet(routineId, exIndex, setIndex) {
  if (!state.setProgress[routineId]) state.setProgress[routineId] = {};
  if (!state.setProgress[routineId][exIndex]) state.setProgress[routineId][exIndex] = {};
  if (state.setProgress[routineId][exIndex][setIndex]) {
    delete state.setProgress[routineId][exIndex][setIndex];
  } else {
    state.setProgress[routineId][exIndex][setIndex] = true;
    // Auto-start rest timer
    startRestTimer(state.defaultRest);
  }
  saveState();
  renderRoutine();
}

function updateCustomReps(routineId, exIndex, setIndex, value) {
  if (!state.customReps[routineId]) state.customReps[routineId] = {};
  if (!state.customReps[routineId][exIndex]) state.customReps[routineId][exIndex] = {};
  state.customReps[routineId][exIndex][setIndex] = value;
  saveState();
}

function toggleCircuitExercise(routineId, round, exIndex) {
  if (!state.circuitProgress[routineId]) state.circuitProgress[routineId] = {};
  if (!state.circuitProgress[routineId][round]) state.circuitProgress[routineId][round] = {};
  if (state.circuitProgress[routineId][round][exIndex]) {
    delete state.circuitProgress[routineId][round][exIndex];
  } else {
    state.circuitProgress[routineId][round][exIndex] = true;
  }
  saveState();
  renderRoutine();
}

function nextCircuitRound(routineId, totalRounds) {
  const current = state.circuitRound[routineId] || 1;
  if (current < totalRounds) {
    state.circuitRound[routineId] = current + 1;
    startRestTimer(120); // 2 min rest between rounds
  } else {
    showToast('All rounds complete! Great work.', 'success');
    stopWorkoutTimer(routineId);
  }
  saveState();
  renderRoutine();
}

function prevCircuitRound(routineId, totalRounds) {
  const current = state.circuitRound[routineId] || 1;
  if (current > 1) state.circuitRound[routineId] = current - 1;
  saveState();
  renderRoutine();
}

// ===== PROGRESS CALCULATION =====
function calculateProgress(r) {
  let total = 0;
  let done = 0;

  if (r.type === 'sets') {
    r.exercises.forEach((ex, ei) => {
      total += ex.sets;
      if (state.setProgress[r.id] && state.setProgress[r.id][ei]) {
        done += Object.keys(state.setProgress[r.id][ei]).length;
      }
    });
  } else if (r.type === 'circuit') {
    total = r.totalRounds * r.exercises.length;
    if (state.circuitProgress[r.id]) {
      Object.values(state.circuitProgress[r.id]).forEach(round => {
        done += Object.keys(round).length;
      });
    }
  } else if (r.type === 'eagle') {
    const maxRound = state.eagleRound[r.id] || 1;
    total = maxRound * r.exercises.length;
    if (state.eagleProgress[r.id]) {
      Object.values(state.eagleProgress[r.id]).forEach(round => {
        done += Object.keys(round).length;
      });
    }
  } else if (r.type === 'flow') {
    const maxRound = state.flowRound[r.id] || 1;
    total = maxRound * r.exercises.length;
    if (state.flowProgress[r.id]) {
      Object.values(state.flowProgress[r.id]).forEach(round => {
        done += Object.keys(round).length;
      });
    }
  } else if (r.type === 'ladder') {
    total = r.ladderRungs.length;
    if (state.ladderProgress[r.id]) {
      done = Object.keys(state.ladderProgress[r.id]).length;
    }
  }

  return total > 0 ? Math.round((done / total) * 100) : 0;
}

function updateAllProgressDisplays(r) {
  // Progress bar is rendered in template, no extra update needed
}

// ===== SETTINGS =====
function openSettings() {
  document.getElementById('settingsModal').classList.add('visible');
  // Update active states
  document.querySelectorAll('.rest-preset').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.rest) === state.defaultRest);
  });
  document.querySelectorAll('.weight-selector [data-weight]').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.weight) === state.kettlebellWeight);
  });
  document.querySelectorAll('[data-sound]').forEach(btn => {
    btn.classList.toggle('active', (btn.dataset.sound === 'on') === state.soundOn);
  });
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('visible');
}

function resetAllProgress() {
  if (confirm('Reset all workout progress? This cannot be undone.')) {
    state.setProgress = {};
    state.customReps = {};
    state.circuitProgress = {};
    state.circuitRound = {};
    state.eagleProgress = {};
    state.eagleRound = {};
    state.flowProgress = {};
    state.flowRound = {};
    state.ladderProgress = {};
    state.workoutTimers = {};
    state.workoutRunning = {};
    saveState();
    closeSettings();
    renderRoutine();
    showToast('All progress reset', 'success');
  }
}

// ===== INIT =====
function init() {
  loadState();

  // Settings listeners
  document.getElementById('settingsBtn').addEventListener('click', openSettings);
  document.getElementById('settingsModal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeSettings();
  });

  document.querySelectorAll('.rest-preset').forEach(btn => {
    btn.addEventListener('click', () => {
      state.defaultRest = parseInt(btn.dataset.rest);
      saveState();
      document.querySelectorAll('.rest-preset').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  document.querySelectorAll('[data-weight]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.kettlebellWeight = parseInt(btn.dataset.weight);
      saveState();
      document.querySelectorAll('[data-weight]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderRoutine();
    });
  });

  document.querySelectorAll('[data-sound]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.soundOn = btn.dataset.sound === 'on';
      saveState();
      document.querySelectorAll('[data-sound]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  renderNav();
  renderRoutine();

  // Resume workout timer if was running
  const r = ROUTINES[state.currentRoutine];
  if (state.workoutRunning[r.id]) {
    startWorkoutTimer(r.id);
  }

  // PWA Service Worker
  if ('serviceWorker' in navigator) {
    const swCode = `
      const CACHE = 'kbpro-v1';
      self.addEventListener('install', e => self.skipWaiting());
      self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
      self.addEventListener('fetch', e => {
        e.respondWith(
          caches.match(e.request).then(r => r || fetch(e.request).then(res => {
            const copy = res.clone();
            caches.open(CACHE).then(c => c.put(e.request, copy));
            return res;
          }).catch(() => caches.match(e.request)))
        );
      });
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(() => {});
  }

  // Prevent body scroll when modal open
  document.getElementById('settingsModal').addEventListener('touchmove', (e) => {
    if (e.target === e.currentTarget) e.preventDefault();
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
